receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

  # Marker processor: stamps every signal (traces, metrics, logs) with proof
  # that it passed through this collector. Filter on
  # collector.claude-collector="washere" in Honeycomb to see only data that
  # went through us. Bump the version whenever this config changes
  # meaningfully so we can tell which generation produced which data.
  transform/mark:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.7")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.7")
    log_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.7")

  transform/agent_timeline:
    error_mode: ignore
    trace_statements:
      # Universal: every span gets a conversation id and an agent name.
      - context: span
        statements:
          - set(attributes["gen_ai.conversation.id"], attributes["session.id"]) where IsString(attributes["session.id"])
          - set(attributes["gen_ai.agent.name"], "Claude Code")

      # claude_code.interaction  ->  invoke_agent Claude Code
      # Also wrap user_prompt into the gen_ai.input.messages JSON shape Honeycomb's
      # Agent Timeline expects (per OTel GenAI semconv: an array of role/parts objects).
      # user_prompt only exists on this root span -- propagating it to child spans
      # (chat, execute_tool) would require cross-span attribute access that OTTL
      # transform doesn't support.
      - context: span
        conditions:
          - 'span.name == "claude_code.interaction"'
        statements:
          - set(attributes["gen_ai.operation.name"], "invoke_agent")
          - set(span.name, Concat(["invoke_agent ", attributes["gen_ai.agent.name"]], ""))
          - 'set(attributes["gen_ai.input.messages"], [{"role": "user", "parts": [{"type": "text", "content": attributes["user_prompt"]}]}]) where IsString(attributes["user_prompt"])'

      # claude_code.llm_request  ->  chat {model}
      # Also alias the bare-namespace token counts onto the GenAI semconv so the
      # Agent Timeline tokens view picks them up. Claude Code's Detailed Beta puts
      # some tokens under gen_ai.* and some under bare keys; this fills the gap.
      - context: span
        conditions:
          - 'span.name == "claude_code.llm_request"'
        statements:
          - set(attributes["gen_ai.operation.name"], "chat")
          - set(span.name, Concat(["chat ", attributes["model"]], "")) where IsString(attributes["model"])
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where IsInt(attributes["input_tokens"])
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where IsInt(attributes["output_tokens"])
          - set(attributes["gen_ai.usage.cache_read_input_tokens"], attributes["cache_read_tokens"]) where IsInt(attributes["cache_read_tokens"])
          - set(attributes["gen_ai.usage.cache_creation_input_tokens"], attributes["cache_creation_tokens"]) where IsInt(attributes["cache_creation_tokens"])

      # claude_code.tool: alias tool input/result onto gen_ai.tool.call.* so the
      # AI Conversations viewer renders the tool detail panes. Requires
      # OTEL_LOG_TOOL_DETAILS=1 + OTEL_LOG_TOOL_CONTENT=1 in Claude Code. Done
      # before the rename blocks below so we match on the original span name and
      # cover both the execute_tool and Task->subagent paths.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool"'
        statements:
          - set(attributes["gen_ai.tool.call.arguments"], attributes["tool_input"]) where IsString(attributes["tool_input"])
          - set(attributes["gen_ai.tool.call.result"], attributes["new_context"]) where IsString(attributes["new_context"])

      # Subagent spawn  ->  invoke_agent {subagent_type}
      # Matched on subagent_type alone, not on tool_name: the spawning tool was
      # called "Task" and is now called "Agent" (observed 2026-10-21), and only
      # the agent-spawning tool carries subagent_type anyway.
      # (subagent_type requires OTEL_LOG_TOOL_DETAILS=1 in Claude Code)
      # Conditions joined with explicit `and` because this OTTL build appears
      # to OR the entries in the conditions array.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool" and IsString(attributes["subagent_type"])'
        statements:
          - set(attributes["gen_ai.agent.name"], attributes["subagent_type"])
          - set(attributes["gen_ai.operation.name"], "invoke_agent")
          - set(span.name, Concat(["invoke_agent ", attributes["subagent_type"]], ""))

      # All other claude_code.tool spans  ->  execute_tool {tool_name}
      # Duration here includes the permission-wait child; tool_name lives only on
      # the parent .tool span, so we use it instead of claude_code.tool.execution.
      # The span.name check alone excludes spans the rule above already renamed.
      # Do NOT guard on gen_ai.operation.name being absent: Claude Code now emits
      # gen_ai.operation.name="execute_tool" itself, so that guard skipped every
      # span and nothing got renamed (JES-158).
      - context: span
        conditions:
          - 'span.name == "claude_code.tool"'
        statements:
          - set(attributes["gen_ai.operation.name"], "execute_tool")
          - set(attributes["gen_ai.tool.name"], attributes["tool_name"]) where IsString(attributes["tool_name"])
          - set(span.name, Concat(["execute_tool ", attributes["tool_name"]], "")) where IsString(attributes["tool_name"])
          - set(span.name, "execute_tool unknown") where not IsString(attributes["tool_name"])

exporters:
  otlp/honeycomb:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

  debug:
    verbosity: normal

  # Raw telemetry archive for takeout-telemetry (all three signals). Writes
  # OTLP JSON in the year=/month=/day=/hour=/minute=/<signal>_<id>.json layout that the takeout
  # packer's "capture" step expects (see notes/takeout-telemetry-supplier.md).
  # No compression: the packer doesn't read gzip. Credentials come from the
  # standard AWS env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), which
  # docker-compose passes through from .env.
  awss3/takeout:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:S3_BUCKET}
      s3_prefix: ${env:S3_PREFIX}
      compression: none
    marshaler: otlp_json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/mark, transform/agent_timeline, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
    logs:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
    metrics:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
