receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

  # Marker processor: stamps every signal (traces, metrics, logs) with proof
  # that it passed through this collector. Filter on
  # collector.claude-collector="washere" in Honeycomb to see only data that
  # went through us. Bump the version whenever this config changes
  # meaningfully so we can tell which generation produced which data.
  transform/mark:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.14")
    metric_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.14")
    log_statements:
      - context: resource
        statements:
          - set(attributes["collector.claude-collector"], "washere")
          - set(attributes["collector.claude-collector.version"], "0.14")

  # Claude Code (checked on 2.1.308 with scripts/dump-raw-spans.sh) already sets
  # gen_ai.conversation.id and gen_ai.provider.name on every span,
  # gen_ai.operation.name on interaction and tool spans, and gen_ai.tool.name /
  # gen_ai.tool.call.id on tool spans. We don't repeat those. What's left: span
  # names, gen_ai.agent.name, the chat operation, token usage, and tool I/O.
  transform/agent_timeline:
    error_mode: ignore
    trace_statements:
      # Universal default agent name; subagent rules below override it.
      - context: span
        statements:
          - set(attributes["gen_ai.agent.name"], "Claude Code")

      # A subagent's own chat spans: query_source_safe is "agent.builtin.<type>"
      # (e.g. general-purpose, Explore) or "agent.custom" for user-defined agents,
      # whose real name is redacted unless detailed beta tracing is on. Tool spans
      # inside a subagent don't carry query_source_safe, so they keep "Claude Code".
      - context: span
        conditions:
          - 'span.name == "claude_code.llm_request" and IsString(attributes["query_source_safe"]) and IsMatch(attributes["query_source_safe"], "^agent\\.builtin\\.")'
        statements:
          - set(attributes["gen_ai.agent.name"], attributes["query_source_safe"])
          - replace_pattern(attributes["gen_ai.agent.name"], "^agent\\.builtin\\.", "")
      - context: span
        conditions:
          - 'span.name == "claude_code.llm_request" and attributes["query_source_safe"] == "agent.custom"'
        statements:
          - set(attributes["gen_ai.agent.name"], "custom agent")

      # claude_code.interaction  ->  invoke_agent Claude Code
      # Also wrap user_prompt into the gen_ai.input.messages JSON shape Honeycomb's
      # Agent Timeline expects (per OTel GenAI semconv: an array of role/parts objects).
      # user_prompt only exists on this root span -- propagating it to child spans
      # (chat, execute_tool) would require cross-span attribute access that OTTL
      # transform doesn't support.
      - context: span
        conditions:
          - 'span.name == "claude_code.interaction"'
        statements:
          - set(span.name, Concat(["invoke_agent ", attributes["gen_ai.agent.name"]], ""))
          - 'set(attributes["gen_ai.input.messages"], [{"role": "user", "parts": [{"type": "text", "content": attributes["user_prompt"]}]}]) where IsString(attributes["user_prompt"])'

      # claude_code.llm_request  ->  chat {model}
      # Token usage onto the GenAI semconv (Claude Code sets no gen_ai.usage.*).
      # Semconv's input_tokens includes cache reads and writes; Claude Code's bare
      # input_tokens doesn't (it's often 2), so we add them up. Cache counts use the
      # semconv names (dotted: cache_read.input_tokens), which is also what
      # Anthropic's own API telemetry uses.
      # The only span link here is "parent_of", from the API's traceresponse header.
      # It points at an Anthropic-internal trace that is never exported, so in
      # Honeycomb it's always a dead link. Drop it. (OTTL can't pick out one link,
      # only replace the whole list.)
      - context: span
        conditions:
          - 'span.name == "claude_code.llm_request"'
        statements:
          - set(span.links, nil)
          - set(attributes["gen_ai.operation.name"], "chat")
          - set(span.name, Concat(["chat ", attributes["model"]], "")) where IsString(attributes["model"])
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"]) where IsInt(attributes["input_tokens"])
          - set(attributes["gen_ai.usage.input_tokens"], attributes["input_tokens"] + attributes["cache_read_tokens"] + attributes["cache_creation_tokens"]) where IsInt(attributes["input_tokens"]) and IsInt(attributes["cache_read_tokens"]) and IsInt(attributes["cache_creation_tokens"])
          - set(attributes["gen_ai.usage.output_tokens"], attributes["output_tokens"]) where IsInt(attributes["output_tokens"])
          - set(attributes["gen_ai.usage.cache_read.input_tokens"], attributes["cache_read_tokens"]) where IsInt(attributes["cache_read_tokens"])
          - set(attributes["gen_ai.usage.cache_creation.input_tokens"], attributes["cache_creation_tokens"]) where IsInt(attributes["cache_creation_tokens"])

      # Tool arguments onto gen_ai.tool.call.arguments, as a JSON object *string*.
      # Semconv prefers a structured object but allows a JSON string; Honeycomb
      # flattens a map attribute into gen_ai.tool.call.arguments.<key> columns, so
      # the column Agent Timeline reads would vanish (seen in v0.13).
      # tool_input (detailed beta tracing only) is "[TOOL INPUT: Bash]\n{...json}",
      # so strip that first line (observed 2026-10-22); if the prefix goes away,
      # ExtractPatterns fails, error_mode: ignore skips it, and the raw copy runs.
      # Without tool_input, fall back to the command or file path that
      # OTEL_LOG_TOOL_DETAILS=1 puts on the span, wrapped in the key tool_input
      # uses: {"command": ...} / {"file_path": ...}. OTTL can parse JSON but not
      # encode it, so we escape \ " and newline/tab/CR by hand (backslash first).
      - context: span
        conditions:
          - 'span.name == "claude_code.tool"'
        statements:
          - 'set(attributes["gen_ai.tool.call.arguments"], ExtractPatterns(attributes["tool_input"], "^\\[TOOL INPUT: [^\\]]*\\]\\n(?P<json>(?s:.*))$")["json"]) where IsString(attributes["tool_input"])'
          - set(attributes["gen_ai.tool.call.arguments"], attributes["tool_input"]) where not IsString(attributes["gen_ai.tool.call.arguments"]) and IsString(attributes["tool_input"])
          - set(attributes["claude-collector.tmp.key"], "command") where not IsString(attributes["gen_ai.tool.call.arguments"]) and IsString(attributes["full_command"])
          - set(attributes["claude-collector.tmp.key"], "file_path") where not IsString(attributes["gen_ai.tool.call.arguments"]) and not IsString(attributes["claude-collector.tmp.key"]) and IsString(attributes["file_path"])
          - set(attributes["claude-collector.tmp.value"], attributes["full_command"]) where IsString(attributes["claude-collector.tmp.key"]) and attributes["claude-collector.tmp.key"] == "command"
          - set(attributes["claude-collector.tmp.value"], attributes["file_path"]) where IsString(attributes["claude-collector.tmp.key"]) and attributes["claude-collector.tmp.key"] == "file_path"
          - 'replace_pattern(attributes["claude-collector.tmp.value"], "\\\\", "\\\\") where IsString(attributes["claude-collector.tmp.value"])'
          - 'replace_pattern(attributes["claude-collector.tmp.value"], "\"", "\\\"") where IsString(attributes["claude-collector.tmp.value"])'
          - 'replace_pattern(attributes["claude-collector.tmp.value"], "\\n", "\\n") where IsString(attributes["claude-collector.tmp.value"])'
          - 'replace_pattern(attributes["claude-collector.tmp.value"], "\\t", "\\t") where IsString(attributes["claude-collector.tmp.value"])'
          - 'replace_pattern(attributes["claude-collector.tmp.value"], "\\r", "\\r") where IsString(attributes["claude-collector.tmp.value"])'
          - 'set(attributes["gen_ai.tool.call.arguments"], Concat(["{\"", attributes["claude-collector.tmp.key"], "\":\"", attributes["claude-collector.tmp.value"], "\"}"], "")) where IsString(attributes["claude-collector.tmp.value"])'
          - delete_key(attributes, "claude-collector.tmp.key")
          - delete_key(attributes, "claude-collector.tmp.value")

      # Tool results onto gen_ai.tool.call.result. With OTEL_LOG_TOOL_CONTENT=1,
      # Claude Code puts tool output in a "tool.output" span event on the tool
      # span: "output" for Bash/MCP/web tools, "content" for Read/Write, "diff"
      # for Edit. Copy the first one present up to the span. Matched on span.type
      # so it doesn't depend on whether the span has been renamed yet.
      - context: spanevent
        conditions:
          - 'spanevent.name == "tool.output" and span.attributes["span.type"] == "tool"'
        statements:
          - set(span.attributes["gen_ai.tool.call.result"], spanevent.attributes["output"]) where IsString(spanevent.attributes["output"])
          - set(span.attributes["gen_ai.tool.call.result"], spanevent.attributes["content"]) where not IsString(span.attributes["gen_ai.tool.call.result"]) and IsString(spanevent.attributes["content"])
          - set(span.attributes["gen_ai.tool.call.result"], spanevent.attributes["diff"]) where not IsString(span.attributes["gen_ai.tool.call.result"]) and IsString(spanevent.attributes["diff"])

      # Subagent spawn  ->  invoke_agent {subagent_type}
      # Matched on subagent_type alone, not on tool_name: the spawning tool was
      # called "Task" and is now called "Agent" (observed 2026-10-21), and only
      # the agent-spawning tool carries subagent_type anyway.
      # (subagent_type requires OTEL_LOG_TOOL_DETAILS=1 in Claude Code)
      # Conditions joined with explicit `and` because this OTTL build appears
      # to OR the entries in the conditions array.
      # Claude Code labels this span execute_tool, so we overwrite the operation.
      - context: span
        conditions:
          - 'span.name == "claude_code.tool" and IsString(attributes["subagent_type"])'
        statements:
          - set(attributes["gen_ai.agent.name"], attributes["subagent_type"])
          - set(attributes["gen_ai.operation.name"], "invoke_agent")
          - set(span.name, Concat(["invoke_agent ", attributes["subagent_type"]], ""))

      # All other claude_code.tool spans  ->  execute_tool {tool_name}
      # Duration here includes the permission-wait child; tool_name lives only on
      # the parent .tool span, so we use it instead of claude_code.tool.execution.
      # The span.name check alone excludes spans the rule above already renamed.
      # Do NOT guard on gen_ai.operation.name being absent: Claude Code emits
      # gen_ai.operation.name="execute_tool" itself, so that guard skipped every
      # span and nothing got renamed (JES-158).
      - context: span
        conditions:
          - 'span.name == "claude_code.tool"'
        statements:
          - set(span.name, Concat(["execute_tool ", attributes["tool_name"]], "")) where IsString(attributes["tool_name"])
          - set(span.name, "execute_tool unknown") where not IsString(attributes["tool_name"])

exporters:
  otlp/honeycomb:
    endpoint: ${env:HONEYCOMB_API_ENDPOINT}
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

  debug:
    verbosity: normal

  # Raw telemetry archive for takeout-telemetry (all three signals). Writes
  # OTLP JSON in the year=/month=/day=/hour=/minute=/<signal>_<id>.json layout that the takeout
  # packer's "capture" step expects (see notes/takeout-telemetry-supplier.md).
  # No compression: the packer doesn't read gzip. Credentials come from the
  # standard AWS env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY), which
  # docker-compose passes through from .env.
  awss3/takeout:
    s3uploader:
      region: ${env:AWS_REGION}
      s3_bucket: ${env:S3_BUCKET}
      s3_prefix: ${env:S3_PREFIX}
      compression: none
    marshaler: otlp_json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/mark, transform/agent_timeline, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
    logs:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
    metrics:
      receivers: [otlp]
      processors: [transform/mark, batch]
      exporters: [otlp/honeycomb, awss3/takeout]
